apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  # 這是單一、非持久化的練習 Redis，不用增加副本假裝資料已同步。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          # 保持資料只在記憶體，並預留容器記憶體給 Redis 本身的額外開銷。
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
          securityContext:
            # 官方 Alpine 映像的 redis UID 是 999，直接以非 root 執行。
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: redis
              containerPort: 6379
          # requests 用於排程，limits 是執行上限，避免本機練習耗盡資源。
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  # 穩定的 redis DNS 名稱，背後實際的 Pod 位址由 Kubernetes 更新。
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
